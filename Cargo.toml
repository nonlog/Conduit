[workspace]
resolver = "2"
members = ["windows/conduit-daemon", "relay"]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.98"
publish = false

# The daemon runs for weeks. Size and predictability over peak throughput.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
