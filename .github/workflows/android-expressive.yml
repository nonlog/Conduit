name: Android Expressive

on:
  push:
    branches: [master]
    paths: ['android/**', '.github/workflows/android-expressive.yml', 'tools/ci-expressive-ui.sh', 'scripts/sync-android-brand.py', 'windows/conduit-daemon/assets/conduit-mark.fragment.svg']
  pull_request:
    branches: [master]
    paths: ['android/**', '.github/workflows/android-expressive.yml', 'tools/ci-expressive-ui.sh', 'scripts/sync-android-brand.py', 'windows/conduit-daemon/assets/conduit-mark.fragment.svg']
  workflow_dispatch:
    inputs:
      signed_apk_only:
        description: Build and sign the release APK without running tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-expressive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Official Expressive build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install SDK 37
        run: '"$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"'
      - name: Install Rust for Android iroh JNI
        run: |
          rustup toolchain install 1.98.0 --profile minimal --target aarch64-linux-android --target x86_64-linux-android
          rustup default 1.98.0
      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Build conduit-iroh Android JNI libraries
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          cargo ndk -t arm64-v8a -t x86_64 -o android/app/src/main/jniLibs build --manifest-path crates/conduit-iroh-android/Cargo.toml --release
      - name: Verify upgraded toolchain and official Material dependency
        if: '!inputs.signed_apk_only'
        working-directory: android
        run: |
          ./gradlew --version
          ./gradlew --no-daemon :app:dependencyInsight --configuration debugRuntimeClasspath --dependency androidx.compose.material3:material3
      - name: Prepare persistent signer for an explicitly dispatched candidate
        if: github.event_name == 'workflow_dispatch'
        env:
          CONDUIT_ANDROID_KEYSTORE_BASE64: ${{ secrets.CONDUIT_ANDROID_KEYSTORE_BASE64 }}
        run: bash scripts/prepare-android-signing.sh
      - name: Assemble Android APKs
        working-directory: android
        env:
          CONDUIT_ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && secrets.CONDUIT_ANDROID_KEYSTORE_PASSWORD || '' }}
          SIGNED_APK_ONLY: ${{ inputs.signed_apk_only }}
        run: |
          if [ "$SIGNED_APK_ONLY" = true ]; then
            ./gradlew --no-daemon --stacktrace assembleRelease
          else
            python3 ../scripts/sync-android-brand.py --check
            ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug assembleRelease
          fi
      - name: Verify scanner and LSPosed entry points survive release shrinking
        if: '!inputs.signed_apk_only'
        run: |
          release_apk="$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f -print -quit)"
          bash scripts/verify-android-entrypoints.sh "$release_apk"
      - name: Verify persistent signing identity
        if: github.event_name == 'workflow_dispatch' && !inputs.signed_apk_only
        run: bash scripts/verify-android-signer.sh android/app/build/outputs/apk/release/app-release.apk
      - name: Verify signed APK certificate
        if: inputs.signed_apk_only
        shell: bash
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          report="$("$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner" verify --verbose --print-certs-pem "$apk")"
          actual="$(printf '%s\n' "$report" | python3 scripts/apk-certificate-digests.py)"
          test "$actual" = "$(tr -d '\r\n ' < android/signing-cert.sha256)"
      - name: Remove private runner signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/conduit-release.p12"
          echo 'CONDUIT_ANDROID_KEYSTORE=' >> "$GITHUB_ENV"
      - name: Upload verified signed candidate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: conduit-android-signed
          retention-days: 3
          if-no-files-found: error
          path: android/app/build/outputs/apk/release/app-release.apk
      - name: Android lint
        if: '!inputs.signed_apk_only'
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace lintDebug
      - uses: actions/upload-artifact@v7
        if: always() && !inputs.signed_apk_only
        with:
          name: conduit-official-expressive-android
          retention-days: 3
          path: |
            android/app/build/outputs/apk/
            android/app/build/outputs/mapping/
            android/app/build/reports/
            android/app/build/test-results/

  ui:
    if: '!inputs.signed_apk_only'
    name: Android 16 visual and interaction tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install SDK 37
        run: '"$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compile UI tests before starting emulator
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleDebugAndroidTest
      - name: Run official Expressive UI tests and export screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/ci-expressive-ui.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: conduit-official-expressive-ui
          retention-days: 3
          path: |
            artifacts/expressive-ui/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
