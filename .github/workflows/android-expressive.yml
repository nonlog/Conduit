name: Android Expressive

on:
  push:
    branches: [codex/android-expressive-glass-20261020]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-expressive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Official Expressive build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install SDK 37
        run: '"$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;37.0.0"'
      - name: Verify upgraded toolchain and official Material dependency
        working-directory: android
        run: |
          ./gradlew --version
          ./gradlew --no-daemon :app:dependencyInsight --configuration debugRuntimeClasspath --dependency androidx.compose.material3:material3
      - name: Test and assemble debug and optimized release
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug assembleRelease
      - name: Android lint
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace lintDebug
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: conduit-official-expressive-android
          retention-days: 3
          path: |
            android/app/build/outputs/apk/
            android/app/build/outputs/mapping/
            android/app/build/reports/
            android/app/build/test-results/

  ui:
    name: Android 16 visual and interaction tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install SDK 37
        run: '"$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;37.0.0"'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compile UI tests before starting emulator
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleDebugAndroidTest
      - name: Run official Expressive UI tests and export screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/ci-expressive-ui.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: conduit-official-expressive-ui
          retention-days: 3
          path: |
            artifacts/expressive-ui/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
