name: Tauri Desktop Preview

on:
  workflow_dispatch:
  push:
    branches: [codex/tauri-desktop-20261023]
    paths:
      - 'windows/conduit-tauri/**'
      - '.github/workflows/tauri-preview.yml'
  pull_request:
    branches: [master]
    paths:
      - 'windows/conduit-tauri/**'
      - '.github/workflows/tauri-preview.yml'

permissions:
  contents: read

jobs:
  tauri-preview:
    name: Tauri Windows x64 / Nova Preview
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Rust 1.98
        shell: pwsh
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0
          rustc --version
          cargo --version

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            windows/conduit-tauri/src-tauri -> target

      - name: Install protoc 36.0 (verified)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '36.0'
          $expected = '510fb2369a4720adb457783768c5e1481a0e1137d9e7694478dfe9b8fe445dc1'
          $archive = Join-Path $env:RUNNER_TEMP "protoc-$version-win64.zip"
          $root = Join-Path $env:RUNNER_TEMP "protoc-$version"
          Invoke-WebRequest -Uri "https://github.com/protocolbuffers/protobuf/releases/download/v$version/protoc-$version-win64.zip" -OutFile $archive
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() -ne $expected) {
            throw 'protoc archive checksum mismatch'
          }
          Expand-Archive $archive -DestinationPath $root
          (Join-Path $root 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Nova UI dependencies
        working-directory: windows/conduit-tauri
        shell: pwsh
        run: bun install --frozen-lockfile

      - name: Check frontend and unit tests
        working-directory: windows/conduit-tauri
        shell: pwsh
        run: |
          bun run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Rust formatting
        shell: pwsh
        run: |
          cargo fmt --manifest-path windows/conduit-tauri/src-tauri/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build original Conduit daemon (no protocol changes)
        shell: pwsh
        run: cargo build --release --locked -p conduit-daemon --bins

      - name: Stage original daemon for separate Tauri preview
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'windows/conduit-tauri/src-tauri/resources/conduit-daemon.exe'
          Copy-Item 'target/release/conduit-daemon.exe' $target
          $manifest = Get-Content 'windows/conduit-tauri/src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          if ($manifest.identifier -eq 'com.conduit.desktop' -or $manifest.productName -notlike '*Preview*') {
            throw 'Preview must not replace the released Conduit Windows app'
          }

      - name: Test Tauri native bridge
        shell: pwsh
        run: cargo test --manifest-path windows/conduit-tauri/src-tauri/Cargo.toml --locked

      - name: Build Tauri NSIS installer
        working-directory: windows/conduit-tauri
        shell: pwsh
        run: bun run tauri build --ci --bundles nsis

      - name: Verify preview installer artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $items = @(Get-ChildItem 'windows/conduit-tauri/src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File)
          if ($items.Count -ne 1 -or $items[0].Length -lt 1MB) {
            throw 'Expected exactly one standalone Tauri preview installer'
          }
          $items | ForEach-Object { Get-FileHash $_.FullName -Algorithm SHA256 | Format-List }

      - name: Upload isolated Tauri preview installer
        uses: actions/upload-artifact@v7
        with:
          name: conduit-tauri-nova-preview
          path: windows/conduit-tauri/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 3
