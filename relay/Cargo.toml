[package]
name = "conduit-relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Deliberately no prost, no snow, no sha2. The relay never parses a frame and never
# holds a key; if a dependency here could decrypt anything, the design is wrong.
[dependencies]
anyhow = "1.0.104"
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
