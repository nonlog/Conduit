[package]
name = "conduit-iroh-android"
version = "0.1.28"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
conduit-iroh = { path = "../conduit-iroh" }
jni = "0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
