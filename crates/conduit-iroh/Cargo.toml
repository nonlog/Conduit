[package]
name = "conduit-iroh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
iroh = "1.3"
# Held on 1.3 to avoid the noq-proto 1.4.0 stream buffer compaction bug.
noq-proto = { version = "~1.3", default-features = false }
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }
tracing = "0.1.44"
url = "2.5"
