// Single source of truth for the conduit wire format. Codegen both sides:
//   Rust    : prost-build
//   Android : protobuf-lite
//
// Framing (LAN and relay, identical):
//   [4-byte BE uint32 length N][N bytes Noise transport ciphertext]
// Ciphertext decrypts to exactly one Envelope. N is validated BEFORE allocation:
// N == 0 or N > MAX_FRAME closes the session. MAX_FRAME is 65535 because that is the
// hard ceiling on a Noise transport message; usable plaintext is 65519 after the tag.

syntax = "proto3";

package conduit;

option java_package = "com.conduit.sync.proto";
option java_multiple_files = true;

enum Kind {
  KIND_UNSPECIFIED   = 0;
  PING               = 1;
  PONG               = 2;
  PAIR_REQUEST       = 3;
  PAIR_RESPONSE      = 4;
  CLIP_TEXT          = 10;
  CLIP_IMAGE_HEADER  = 11;
  CLIP_IMAGE_CHUNK   = 12;
  NOTIF_NEW          = 20;
  NOTIF_UPDATE       = 21;
  NOTIF_REMOVE       = 22;
  NOTIF_ACTION       = 23;
  FILE_OFFER         = 30;
  FILE_CHUNK         = 31;
  FILE_RESULT        = 32;
}

message Envelope {
  uint64 message_id = 1;  // per-session counter from 1; dedupe state resets with the session
  uint64 ack_for    = 2;  // reserved: whole-file completion uses FileResult + transfer_id instead
  Kind   kind       = 3;
  bytes  payload    = 4;  // serialized inner message below
}

// --- pairing (Noise XX; fingerprint confirmed out of band) ---

// Sent once per session, straight after the handshake, by the side that has a name worth
// showing. Not a request for anything — the Noise handshake already decided whether the
// peer is who it claims — so nothing answers it. The phone has no way to learn the
// desktop's name otherwise: mDNS carries it, but a relay session never sees an mDNS
// record, and that is exactly the case where the name matters most.
message PairRequest {
  string device_id   = 1;  // BASE64URL(SHA256(static_pub)), lowercase
  string device_name = 2;
  bytes  static_pub  = 3;  // empty over an established session: the handshake carried it
  string version     = 4;
}

message PairResponse {
  bool  accept     = 1;
  bytes static_pub = 2;
}

// --- clipboard ---

message ClipText {
  string text         = 1;  // normalized CRLF -> LF before send
  uint64 timestamp_ms = 2;
  string mime         = 3;  // "text/plain"
}

message ClipImageHeader {
  string mime         = 1;
  uint32 total_bytes  = 2;  // > MAX_MESSAGE (10 MiB) -> reject, do not allocate
  uint32 chunk_size   = 3;  // fixed 32 KiB: 64 KiB overflows the 65519-byte plaintext ceiling
  uint32 chunk_count  = 4;  // ceil(total_bytes / chunk_size)
  string file_name    = 5;
  uint64 timestamp_ms = 6;
  bytes  header_id    = 7;  // hash of this header; chunks reference it
  // Non-clipboard image compatibility marker. A camera photo sets this, and a screenshot
  // deliberately sets it too so an older desktop that does not know field 9 still treats
  // the image as a toast rather than silently overwriting the clipboard.
  bool   photo        = 8;
  // Explicit screenshot semantics for peers that understand them. `photo=true` remains set
  // alongside this field for backward-safe behaviour; this flag only changes the toast's
  // meaning/text and lets future capture-specific behaviour stay unambiguous.
  bool   screenshot   = 9;
}

message ClipImageChunk {
  uint32 index     = 1;
  bytes  data      = 2;
  bytes  header_id = 3;
  uint32 stream_id = 4;  // so a ClipText arriving mid-image does not head-of-line block
}

// --- files ---
//
// Deliberately not ClipImageHeader with a flag on it. Three things differ and every one
// of them matters: total_bytes is 64-bit because a file is not a screenshot, nothing here
// ever touches the clipboard, and the receiver writes each chunk straight to disk instead
// of assembling the whole transfer in memory. Reusing the image path would have put a
// 500 MB Vec in a daemon whose entire selling point is bounded memory.
//
// One transfer at a time per session, so there is no windowing or per-chunk ack: chunks are already
// ordered and reliable inside one Noise session on one TCP stream. A single FileResult is sent only
// after receiver publication. A transfer dies with its session, which stops a half-written file
// from being inherited by the next one.

message FileOffer {
  string name         = 1;  // basename; the receiver sanitises it regardless
  string mime         = 2;
  uint64 total_bytes  = 3;
  uint32 chunk_size   = 4;  // 32 KiB, same ceiling as an image chunk
  uint64 chunk_count  = 5;  // ceil(total_bytes / chunk_size)
  bytes  transfer_id  = 6;  // chunks reference it, so a stale chunk cannot join a new file
  uint64 timestamp_ms = 7;
}

message FileChunk {
  uint64 index       = 1;
  bytes  data        = 2;
  bytes  transfer_id = 3;
}

// Receiver -> sender after publication (or a recoverable receive-side refusal). This is not a
// per-chunk ACK and therefore adds no round-trip to the streaming data path. Its only purpose is to
// distinguish "the sender wrote the last TCP frame" from "the receiver actually published the
// file", which matters to the desktop CLI and future Explorer integration.
message FileResult {
  bytes  transfer_id = 1;
  bool   success     = 2;
  string error       = 3;
  string name        = 4;
}

// --- notifications ---

message TextMessage {
  string sender = 1;
  string text   = 2;
}

message NotifActionDesc {
  string label            = 1;
  uint32 index            = 2;
  bool   has_remote_input = 3;
  string result_key       = 4;
}

message NotifNew {
  string key                       = 1;  // becomes the Windows toast tag
  string package                   = 2;
  string tag                       = 3;
  string group_key                 = 4;  // becomes the toast group
  string title                     = 5;
  string text                      = 6;
  uint64 timestamp_ms              = 7;
  repeated TextMessage messages    = 8;  // MessagingStyle history
  bytes  app_icon_png              = 9;  // only on first-seen package+versionCode (LRU 64)
  bytes  large_icon_png            = 10; // only when non-null, downscaled to 256px
  repeated NotifActionDesc actions = 11;
  string app_name                  = 12; // resolved label, because a toast showing
                                         // "com.tencent.mm" is useless to a human
}

message NotifUpdate {
  string key   = 1;  // same key as NotifNew -> ToastNotifier.Update(data, tag, group)
  string title = 2;
  string text  = 3;
}

message NotifRemove {
  string key     = 1;
  string tag     = 2;
  string package = 3;
}

message NotifAction {
  string key          = 1;
  uint32 action_index = 2;
  string reply_text   = 3;  // set when the action has a RemoteInput
}
