org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
# Gradle is pinned at 8.14.3: AGP 8.x cannot run on >= 9.6, and 8.14.4+ is not fetchable
# from this network. KGP wants 8.14.4 from Kotlin 2.5.0 on, so bumping Kotlin fails loudly
# rather than after eight lines of warning on every build.
kotlin.suppressGradlePluginWarnings=DeprecatedGradleVersionWarning

android.useAndroidX=true
android.nonTransitiveRClass=true
