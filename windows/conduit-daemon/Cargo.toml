[package]
name = "conduit-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clipboard-win = { version = "5.4.1", features = ["monitor", "std"] }
# Default features pull an async facade and a `log` bridge; neither is used, and the
# daemon's own thread is easier to account for without them.
mdns-sd = { version = "0.21.0", default-features = false }
prost = "0.14.4"
sha2 = "0.11.0"
snow = "0.10.0"
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Graphics_Imaging + Storage_Streams are what let image clipboard sync avoid an image
# crate: Windows already ships PNG and BMP codecs, and this dependency was here anyway.
# Storage + ApplicationModel_DataTransfer are for the photo toast: handing a file to
# Snipping Tool means minting a SharedStorageAccessManager token for it.
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Data_Xml_Dom", "UI_Notifications", "Foundation_Collections", "Graphics_Imaging", "Storage", "Storage_Streams", "ApplicationModel_DataTransfer"] }
windows-registry = "0.6.1"

[build-dependencies]
prost-build = "0.14.4"
