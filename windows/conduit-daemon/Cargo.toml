[package]
name = "conduit-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
prost = "0.14.4"
sha2 = "0.11.0"
snow = "0.10.0"
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
prost-build = "0.14.4"
